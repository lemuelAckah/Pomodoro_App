<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="StudyFlow - a focused workspace for productive study sessions." />
  <title>StudyFlow | Focus with intention</title>

  <!-- Social share cards (WhatsApp, X, Facebook, Telegram) -->
  <!-- For a custom domain, replace the og:image/twitter:image paths with
       absolute URLs, e.g. https://your-domain/og-cover.png -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="StudyFlow" />
  <meta property="og:title" content="StudyFlow — Focus with intention" />
  <meta property="og:description" content="Pomodoro sessions, streaks, study buddies and rewards — one calm workspace for deep work. Free forever." />
  <meta property="og:image" content="/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="StudyFlow — a calm workspace for deep work" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="StudyFlow — Focus with intention" />
  <meta name="twitter:description" content="Pomodoro sessions, streaks, study buddies and rewards — one calm workspace for deep work. Free forever." />
  <meta name="twitter:image" content="/og-cover.png" />

  <!-- Once you own a custom domain, add: <link rel="canonical" href="https://your-domain/" /> -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "StudyFlow",
          "applicationCategory": "EducationalApplication",
          "operatingSystem": "Web",
          "description": "Pomodoro sessions, streaks, study buddies and rewards — one calm workspace for deep work. Free forever.",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "featureList": "Pomodoro timer, 10 guided study techniques, focus music and sound studio, book library, study rooms and sprints, streaks, coins and rewards"
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Is StudyFlow really free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes — the timer, techniques, community, book library and rewards are free forever. Optional MoMo coin top-ups buy extra fuel, never access."
              }
            },
            {
              "@type": "Question",
              "name": "Do I need an account?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No — start focusing immediately. A free account syncs streaks, coins and books across devices, so it's worth adding when you're ready."
              }
            },
            {
              "@type": "Question",
              "name": "What is the MoMo top-up?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Coins normally come free from focus sessions and streaks. Want more? MTN, Telecel and AirtelTigo mobile money through Moolre tops you up in seconds."
              }
            },
            {
              "@type": "Question",
              "name": "Does it work offline?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes — StudyFlow installs as an app and keeps the shell and your data on-device, so a dropped connection never stops a session."
              }
            },
            {
              "@type": "Question",
              "name": "Is my data private?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You choose what's visible. Tasks, notes and reading stay on your device unless you sign in to sync — and profile visibility is yours to set."
              }
            }
          ]
        }
      ]
    }
  </script>

  <meta name="theme-color" content="#47765a" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
  <link rel="icon" type="image/png" href="/icon-512.png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script>try{if(localStorage.getItem("sf-night")==="true"){document.documentElement.setAttribute("data-night","1");}}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/app.js"></script>
</body>

</html>
